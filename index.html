<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Book</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="bg-primary text-white py-4">
      <h1 class="mb-4 text-center">
        PhoneBook
      <i class="bi bi-book"></i>
    </h1>
    </nav>
    <main class="container my-4">
      <section class="card p-4 mb-4">
        <h2 class="h4 mb-3">Add New Contact</h2>
        <!-- contact list form -->
        <form id="contactForm">
          <div class="mb-3">
            <label label="nameInput" class="form-label">Contact Name</label>
            <input
              type="text"
              id="nameInput"
              class="form-control"
              placeholder="Enter contact name"
              required
            />
          </div>
          <div class="mb-3">
            <label for="phoneInput" class="form-label">Phone Number</label>
            <input
              type="tel"
              id="phoneInput"
              class="form-control"
              placeholder="Enter Phone Number"
            />
          </div>
          <div class="row">
            <div class="col-md-4">
              <button type="button" id="addBtn" class="btn btn-primary">
            Add New Contact
              </button>
            </div>
            <div class="col-md-8">
                <div class="input-group-text">
                  <span class="input-group-text">
                  <i class="bi bi-search"></i></span>

                  <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Enter contact by name"
                  />
              </div>              
            </div>
          </div>
        </form>
      </section>
      <!-- search element -->
      <section class="mb-4">
      
      </section>
      <!-- Fetch Contacts List -->
    <h2>Contact List</h2>
        <ul id="contactsList" class="list-group"></ul>
        <p id="noContact" class="text-center mt-3 d-none">No Contacts Found</p>
      </section>  <section>
        <
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
