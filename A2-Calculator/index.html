<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task2-Calculator</title>
    <link rel="stylesheet" href="stylea2.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <!-- First Form -->
          <form class="form1 bg-white p-4 rounded shadow mb-4" id="form1">
            <div class="mb-3">
              <h3>Add - Sub - Mul - Div</h3>
              <label for="fnumber" class="form-label"> First Number </label>

              <input
                type="number"
                id="fnumber"
                class="form-control"
                placeholder="Enter first number"
              />
            </div>

            <div class="mb-3">
              <label for="snumber" class="form-label"> Second Number </label>

              <input
                type="number"
                id="snumber"
                class="form-control"
                placeholder="Enter second number"
              />
            </div>

            <div>
              <h3 id="result" class="alert alert-light">Result :</h3>
            </div>
          </form>

          <!-- Square / Cube Form -->
          <form class="form2 bg-white p-4 rounded shadow mb-4" id="form2">
            <div class="mb-3">
              <h3>Square - Cube</h3>
              <label for="number" class="form-label"> Number </label>

              <input
                type="number"
                id="number"
                class="form-control"
                placeholder="Enter a Number"
              />
            </div>

            <div>
              <h3 id="res" class="alert alert-light">Result</h3>
            </div>
          </form>

          <!-- Buttons -->
          <div class="d-grid gap-2">
            <button type="button" onclick="add()" class="btn btn-primary">
              Addition
            </button>

            <button type="button" onclick="sub()" class="btn btn-primary">
              Subtraction
            </button>

            <button type="button" onclick="mul()" class="btn btn-primary">
              Multiplication
            </button>

            <button type="button" onclick="div()" class="btn btn-primary">
              Division
            </button>

            <button type="button" onclick="square()" class="btn btn-success">
              Square
            </button>

            <button type="button" onclick="cube()" class="btn btn-success">
              Cube
            </button>
          </div>
        </div>
      </div>
    </div>
